<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find My Fit — ZipFit Insoles</title>

<!--
  ============================================================
  ZipFit Insole Finder — drop-in Shopify quiz
  ============================================================
  Integration notes:

  1. To embed in a Shopify section/snippet, paste the contents
     of <style>, <body>, and <script> into a section template
     (e.g. sections/insole-quiz.liquid). The widget is fully
     self-scoped under .zf-quiz.

  2. Replace product URLs + handles in the PRODUCTS map below
     with Shopify product handles. The "Shop" button uses
     /products/{handle} so it works inside any storefront.

  3. To use a Shopify "Add to cart" instead of a product link,
     swap the <a class="zf-shop"> with a form posting to
     /cart/add with the product's variant ID. The recommend()
     function returns the matched product id — surface it in
     a hidden input.

  4. Fonts: Outfit + Inter are loaded from Google Fonts. In a
     Shopify build, use {{ 'outfit' | global_asset_url | font_face }}
     or self-host. The widget falls back to system sans cleanly.

  5. The quiz emits a CustomEvent('zf:recommend', { detail: {...} })
     on the document when a recommendation is shown — wire this
     to your analytics (Klaviyo, GA4, etc.).
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* --------- Local tokens (mirrors ZipFit design system) --------- */
  .zf-quiz {
    --zf-red:#EF4623;
    --zf-red-dark:#C8371A;
    --zf-black:#272727;
    --zf-white:#FFFFFF;
    --zf-bg:#F1EDE7;
    --zf-bg-deep:#E8E2D9;
    --zf-yellow:#FBCF21;
    --zf-green:#68BD46;
    --zf-aqua:#5DC7D1;
    --zf-blue:#2F438F;
    --zf-purple:#952A7D;
    --zf-rainbow:linear-gradient(90deg,#EF4623 0%,#FBCF21 20%,#68BD46 40%,#5DC7D1 60%,#2F438F 80%,#952A7D 100%);
    --border:rgba(39,39,39,0.12);
    --border-strong:rgba(39,39,39,0.22);
    --fg-2:#4A4A4A;
    --fg-3:#7A7670;
    --ease:cubic-bezier(0.2,0.7,0.2,1);

    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--zf-black);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }

  /* ------- Base reset, scoped ------- */
  .zf-quiz *,.zf-quiz *::before,.zf-quiz *::after{box-sizing:border-box}
  .zf-quiz button{font-family:inherit;color:inherit;cursor:pointer}

  /* ------- Page wash ------- */
  body{margin:0;background:#F1EDE7;font-family:'Inter',system-ui,sans-serif}

  /* ------- Wrapper ------- */
  .zf-quiz{
    max-width:560px;
    margin:0 auto;
    padding:32px 20px 48px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ------- Header ------- */
  .zf-head{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .zf-mark{
    font-family:'Outfit',sans-serif;font-weight:900;font-size:18px;
    letter-spacing:-0.02em;text-transform:uppercase;color:var(--zf-black);
    display:flex;align-items:center;gap:8px;
  }
  .zf-mark svg{display:block}
  .zf-mark .reg{font-size:9px;font-weight:600;vertical-align:super;letter-spacing:0;margin-left:1px}
  .zf-pill{
    margin-left:auto;
    font-family:'Inter',sans-serif;font-weight:600;
    font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--fg-2);
    padding:5px 10px;border:1px solid var(--border);border-radius:999px;
    background:rgba(255,255,255,0.5);
  }

  /* ------- Intro block ------- */
  .zf-intro{margin-bottom:24px}
  .zf-eyebrow{
    font-size:11px;font-weight:600;letter-spacing:0.16em;
    text-transform:uppercase;color:var(--fg-2);margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .zf-eyebrow .bar{
    flex:1;height:1px;background:var(--border);max-width:80px;
  }
  .zf-title{
    font-family:'Outfit',sans-serif;font-weight:800;
    font-size:clamp(34px,8vw,44px);
    line-height:0.96;letter-spacing:-0.02em;text-transform:uppercase;
    margin:0 0 8px;color:var(--zf-black);
  }
  .zf-sub{
    font-size:15px;color:var(--fg-2);line-height:1.45;margin:0;
    max-width:42ch;
  }

  /* ------- Progress ------- */
  .zf-progress{
    margin:24px 0 28px;
    display:flex;align-items:center;gap:14px;
  }
  .zf-progress-track{
    flex:1;height:3px;background:var(--border);border-radius:999px;overflow:hidden;
    position:relative;
  }
  .zf-progress-fill{
    position:absolute;inset:0 auto 0 0;width:0%;
    background:var(--zf-rainbow);border-radius:999px;
    transition:width .6s var(--ease);
  }
  .zf-progress-count{
    font-family:'Inter',sans-serif;font-weight:600;
    font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-2);
    font-variant-numeric:tabular-nums;
    min-width:54px;text-align:right;
  }

  /* ------- Question stage ------- */
  .zf-stage{flex:1}
  .zf-q-label{
    font-family:'Inter',sans-serif;font-weight:600;
    font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--zf-red);
    margin-bottom:12px;
  }
  .zf-q-text{
    font-family:'Outfit',sans-serif;font-weight:800;
    font-size:clamp(24px,5.5vw,30px);
    line-height:1.08;letter-spacing:-0.015em;text-transform:uppercase;
    color:var(--zf-black);margin:0 0 22px;
  }

  /* ------- Options ------- */
  .zf-options{display:flex;flex-direction:column;gap:10px}

  /* ------- Size step (measure insole in cm) ------- */
  .zf-size-wrap{
    background:var(--zf-white);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 18px 20px;
  }

  .zf-measure-illus{
    background:var(--zf-bg);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:18px;
    display:flex;align-items:center;gap:14px;
  }
  .zf-measure-illus svg{flex-shrink:0;width:96px;height:auto;display:block}
  .zf-measure-illus .zf-measure-text{
    flex:1;min-width:0;
  }
  .zf-measure-illus .zf-measure-text b{
    display:block;
    font-family:'Outfit',sans-serif;font-weight:700;
    font-size:13px;letter-spacing:-0.005em;text-transform:uppercase;
    color:var(--zf-black);margin-bottom:4px;
  }
  .zf-measure-illus .zf-measure-text span{
    font-size:12.5px;color:var(--fg-2);line-height:1.4;
  }

  .zf-readout{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-bottom:12px;
  }
  .zf-readout-cm{
    font-family:'Outfit',sans-serif;font-weight:900;
    font-size:54px;line-height:0.95;letter-spacing:-0.03em;color:var(--zf-black);
    font-variant-numeric:tabular-nums;
  }
  .zf-readout-cm .unit{
    font-size:18px;font-weight:700;color:var(--fg-3);letter-spacing:0.02em;
    margin-left:6px;text-transform:lowercase;
  }
  .zf-readout-size{
    text-align:right;
  }
  .zf-readout-size .lbl{
    font-family:'Inter',sans-serif;font-weight:600;
    font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-3);
    margin-bottom:4px;
  }
  .zf-readout-size .val{
    font-family:'Outfit',sans-serif;font-weight:800;
    font-size:20px;letter-spacing:-0.01em;text-transform:uppercase;color:var(--zf-black);
  }
  .zf-readout-size .val .us{display:block;font-size:11px;color:var(--fg-3);font-weight:600;letter-spacing:0.04em;margin-top:3px;text-transform:none}

  .zf-stepper{
    display:flex;align-items:stretch;gap:10px;
    margin-bottom:14px;
  }
  .zf-step-btn{
    appearance:none;
    width:48px;height:48px;flex-shrink:0;
    border:1px solid var(--border);
    background:var(--zf-white);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .12s var(--ease),background .12s var(--ease),transform .1s var(--ease);
  }
  .zf-step-btn:hover{border-color:var(--border-strong)}
  .zf-step-btn:active{transform:translateY(1px)}
  .zf-step-btn svg{width:16px;height:16px;stroke:var(--zf-black);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .zf-slider-wrap{
    flex:1;
    position:relative;
    display:flex;align-items:center;
    padding:0 4px;
  }
  .zf-slider{
    appearance:none;-webkit-appearance:none;
    width:100%;height:6px;
    background:transparent;
    margin:0;
  }
  .zf-slider-track{
    position:absolute;left:4px;right:4px;top:50%;height:6px;
    transform:translateY(-50%);
    background:var(--border);
    border-radius:999px;
    overflow:hidden;
  }
  .zf-slider-fill{
    position:absolute;inset:0 auto 0 0;width:0%;
    background:var(--zf-rainbow);
    border-radius:999px;
  }
  .zf-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:24px;height:24px;border-radius:50%;
    background:var(--zf-white);
    border:2px solid var(--zf-black);
    box-shadow:0 2px 6px rgba(39,39,39,0.18);
    cursor:grab;
    position:relative;z-index:1;
  }
  .zf-slider::-webkit-slider-thumb:active{cursor:grabbing;background:var(--zf-black)}
  .zf-slider::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;
    background:var(--zf-white);
    border:2px solid var(--zf-black);
    box-shadow:0 2px 6px rgba(39,39,39,0.18);
    cursor:grab;
  }
  .zf-slider:focus{outline:none}
  .zf-slider:focus::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(239,70,35,0.25),0 2px 6px rgba(39,39,39,0.18)}

  .zf-slider-ticks{
    display:flex;justify-content:space-between;
    margin-top:8px;padding:0 4px;
    font-family:'Inter',sans-serif;font-weight:500;
    font-size:10px;letter-spacing:0.06em;color:var(--fg-3);
    font-variant-numeric:tabular-nums;
  }

  .zf-size-help{
    margin-top:14px;
    font-size:12px;color:var(--fg-3);line-height:1.45;
  }
  .zf-size-help b{color:var(--fg-2);font-weight:600}

  /* Recommended size pill on result */
  .zf-size-line{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 24px 0;
  }
  .zf-size-line .zf-size-pill{
    display:inline-flex;align-items:baseline;gap:6px;
    background:var(--zf-bg);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 12px;
    font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;
    letter-spacing:-0.005em;text-transform:uppercase;
    color:var(--zf-black);
  }
  .zf-size-line .zf-size-pill small{font-size:10px;font-weight:600;letter-spacing:0.1em;color:var(--fg-3);text-transform:uppercase}
  .zf-size-line .your-size{
    font-family:'Inter',sans-serif;font-weight:500;font-size:12px;color:var(--fg-2);
    letter-spacing:0.04em;
  }
  .zf-opt{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;
    border:1px solid var(--border);border-radius:14px;
    background:var(--zf-white);
    text-align:left;width:100%;
    transition:border-color .15s var(--ease),background .15s var(--ease),transform .15s var(--ease);
    position:relative;
  }
  .zf-opt:hover{border-color:var(--border-strong)}
  .zf-opt:active{transform:translateY(1px)}
  .zf-opt.selected{
    border-color:var(--zf-black);
    background:var(--zf-white);
    box-shadow:inset 0 0 0 1px var(--zf-black);
  }
  .zf-opt-icon{
    width:44px;height:44px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;background:var(--zf-bg);
    color:var(--zf-black);
    transition:background .15s var(--ease),color .15s var(--ease);
  }
  .zf-opt.selected .zf-opt-icon{background:var(--zf-black);color:var(--zf-white)}
  .zf-opt-icon svg{width:22px;height:22px;stroke-width:1.75}
  .zf-opt-text{display:flex;flex-direction:column;flex:1;min-width:0}
  .zf-opt-title{
    font-family:'Outfit',sans-serif;font-weight:700;
    font-size:15px;letter-spacing:-0.005em;text-transform:uppercase;
    color:var(--zf-black);line-height:1.1;
  }
  .zf-opt-desc{
    font-size:13px;color:var(--fg-2);margin-top:4px;line-height:1.35;
  }
  .zf-opt-check{
    width:22px;height:22px;flex-shrink:0;border-radius:50%;
    border:1.5px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s var(--ease),background .15s var(--ease);
  }

  'ski|nordic':     { id:'zippy',     why:"Nordic boots demand a low, flexible footbed. The Zippy is ZipFit's slimmest insole — it preserves the boot's natural flex while adding genuine arch support." },
  // running / biking
  'run|running':    { id:'zippy',     why:"The Zippy is ZipFit's lightest and slimmest insole — built for running shoes where flexibility and low stack height matter most." },
  'run|biking':     { id:'crossover', why:"The Crossover's responsive EVA cork base gives cycling and court shoes a stable, energy-returning platform without packing out." },
  // hiking
  'hike|hikingboot':{ id:'wander',    why:"The Wander is built for the long haul. Self-molding cork composite gives the most structured support in the lineup — perfect for hiking boots and long days on your feet." },
  'hike|trailrun':  { id:'crossover', why:"For trail runners, the Crossover blends cork's stability with a moisture-managing top sheet — a workhorse for fast-and-light days." },
  // everyday
  'everyday|workboot':{ id:'wander',  why:"Work boots earn the Wander. Its thermoformable cork composite molds to your foot and stays put through 10-hour shifts on hard floors." },
  'everyday|casual':  { id:'legacy',  why:"The Legacy is the original drop-in for daily wear. The natural leather top sheet wears in over time for a fit that feels custom in any sneaker, loafer, or low boot." },
};

function recommend(a){
  const key = `${a.activity}|${a.shoe}`;
  return MATRIX[key] || { id:'legacy', why:'For everyday casual wear, the Legacy is a versatile all-rounder. The natural leather top breaks in over time for a truly customized feel in any shoe.' };
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
let answers = {};
let step = 0;

const stage = document.getElementById('zfStage');
const intro = document.getElementById('zfIntro');
const progressWrap = document.getElementById('zfProgressWrap');
const progressFill = document.getElementById('zfProgress');
const progressCount = document.getElementById('zfCount');

const TOTAL_STEPS = 3;

/* ZipFit insole sizes — mapped by INSOLE LENGTH in cm (heel→toe).
   Anchored to US Men's last lengths: M 9 = 26.5cm, M 10 = 27.5cm.
   Each US size step ≈ 1.0cm of insole length. Each ZipFit size
   range covers two US sizes. */
const SIZE_RANGES = [
  { code:'XS',  cm:[21.0, 23.0], mensUS:'4 – 5',    womensUS:'5.5 – 6.5' },
  { code:'S',   cm:[23.0, 25.0], mensUS:'6 – 7',    womensUS:'7.5 – 8.5' },
  { code:'M',   cm:[25.0, 27.0], mensUS:'8 – 9',    womensUS:'9.5 – 10.5' },
  { code:'L',   cm:[27.0, 29.0], mensUS:'10 – 11',  womensUS:'11.5 – 12.5' },
  { code:'XL',  cm:[29.0, 31.0], mensUS:'12 – 13',  womensUS:'13.5 – 14.5' },
  { code:'XXL', cm:[31.0, 33.0], mensUS:'14 – 15',  womensUS:'15.5 – 16.5' },
];

const CM_MIN = 21.0;
const CM_MAX = 33.0;
const CM_STEP = 0.5;
const CM_DEFAULT = 26.5;

function sizeForCm(cm){
  if (cm == null) return null;
  if (cm < SIZE_RANGES[0].cm[0]) return SIZE_RANGES[0];
  if (cm >= SIZE_RANGES[SIZE_RANGES.length-1].cm[1]) return SIZE_RANGES[SIZE_RANGES.length-1];
  return SIZE_RANGES.find(r => cm >= r.cm[0] && cm < r.cm[1]) || SIZE_RANGES[2];
}

/* Returns the live question for the given step (0, 1, or 2).
   Step 1's content + key change based on the chosen activity.
   Step 2 is a custom size picker (rendered separately). */
function questionFor(step){
  if (step === 0) return QUESTIONS[0];
  if (step === 1) {
    const sub = SHOES_BY_ACTIVITY[answers.activity];
    return {
      label: 'Step 2 of 3',
      text:  sub.text,
      key:   'shoe',
      opts:  sub.opts,
    };
  }
  return {
    label: 'Step 3 of 3',
    text:  'How long is your insole?',
    key:   'insoleCm',
  };
}

function setProgress(){
  const total = TOTAL_STEPS;
  const done = step;
  const pct = step >= total ? 100 : Math.round((done / total) * 100);
  progressFill.style.width = pct + '%';
  progressCount.textContent = `${Math.min(done,total)} / ${total}`;
  progressCount.setAttribute('aria-label', `Question ${Math.min(done+1,total)} of ${total}`);
  progressWrap.hidden = false;
}

function svgUse(id, cls){
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><use href="#${id}"/></svg>`;
}

function renderQuestion(){
  intro.hidden = step > 0;
  setProgress();
  if (step === 2) { renderSizeStep(); return; }
  const q = questionFor(step);
  stage.innerHTML = `
    <div class="zf-fade-enter" key="q${step}">
      <div class="zf-q-label">${q.label}</div>
      <h2 class="zf-q-text">${q.text}</h2>
      <div class="zf-options">
        ${q.opts.map(o => `
          <button class="zf-opt ${answers[q.key]===o.val ? 'selected':''}" data-val="${o.val}">
            <span class="zf-opt-icon">${svgUse(o.icon)}</span>
            <span class="zf-opt-text">
              <span class="zf-opt-title">${o.title}</span>
              <span class="zf-opt-desc">${o.desc}</span>
            </span>
            <span class="zf-opt-check">${svgUse('i-check')}</span>
          </button>
        `).join('')}
      </div>
      <div class="zf-actions">
        ${step > 0 ? `<button class="zf-btn zf-btn--secondary" id="zfBack" aria-label="Back">${svgUse('i-arrow-left')}</button>` : ''}
        <button class="zf-btn" id="zfNext" ${answers[q.key] ? '' : 'disabled'}>
          ${step === TOTAL_STEPS - 1 ? 'See my insole' : 'Next'}
          ${svgUse('i-arrow-right')}
        </button>
      </div>
    </div>`;

  // Option click
  stage.querySelectorAll('.zf-opt').forEach(el => {
    el.addEventListener('click', () => {
      const newVal = el.dataset.val;
      // If activity changes, invalidate the downstream shoe answer.
      if (q.key === 'activity' && answers.activity && answers.activity !== newVal) {
        delete answers.shoe;
      }
      answers[q.key] = newVal;
      stage.querySelectorAll('.zf-opt').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('zfNext').removeAttribute('disabled');
    });
  });

  document.getElementById('zfNext').addEventListener('click', () => {
    if (!answers[q.key]) return;
    step++;
    if (step >= TOTAL_STEPS) renderResult();
    else renderQuestion();
  });
  const back = document.getElementById('zfBack');
  if (back) back.addEventListener('click', () => { step--; renderQuestion(); });
}

/* ============================================================
   STEP 3 — MEASURE INSOLE LENGTH IN CM
   ============================================================ */
function renderSizeStep(){
  if (answers.insoleCm == null) answers.insoleCm = CM_DEFAULT;
  const cm = answers.insoleCm;
  const range = sizeForCm(cm);
  const pct = ((cm - CM_MIN) / (CM_MAX - CM_MIN)) * 100;

  stage.innerHTML = `
    <div class="zf-fade-enter" key="q2">
      <div class="zf-q-label">Step 3 of 3</div>
      <h2 class="zf-q-text">How long is your insole?</h2>

      <div class="zf-size-wrap">
        <div class="zf-measure-illus">
          <svg viewBox="0 0 140 70" aria-hidden="true">
            <!-- Insole silhouette: heel left, toe right -->
            <path d="M14 38 C 14 26, 22 21, 34 21 L 100 21 C 118 21, 128 27, 128 38 C 128 49, 116 54, 100 54 L 34 54 C 22 54, 14 50, 14 38 Z"
              fill="#272727" opacity="0.08"/>
            <path d="M14 38 C 14 26, 22 21, 34 21 L 100 21 C 118 21, 128 27, 128 38 C 128 49, 116 54, 100 54 L 34 54 C 22 54, 14 50, 14 38 Z"
              fill="none" stroke="#272727" stroke-width="1.5"/>
            <!-- Measure arrows -->
            <line x1="14" y1="63" x2="128" y2="63" stroke="#EF4623" stroke-width="1.5"/>
            <line x1="14" y1="59" x2="14" y2="67" stroke="#EF4623" stroke-width="1.5"/>
            <line x1="128" y1="59" x2="128" y2="67" stroke="#EF4623" stroke-width="1.5"/>
            <polyline points="18,60 14,63 18,66" fill="none" stroke="#EF4623" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="124,60 128,63 124,66" fill="none" stroke="#EF4623" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Tick on heel/toe -->
            <line x1="14" y1="15" x2="14" y2="60" stroke="#272727" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
            <line x1="128" y1="15" x2="128" y2="60" stroke="#272727" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
          </svg>
          <div class="zf-measure-text">
            <b>Pull the insole out of your shoe</b>
            <span>Lay it flat and measure heel to toe in centimeters.</span>
          </div>
        </div>

        <div class="zf-readout">
          <div class="zf-readout-cm" id="zfCmReadout">${cm.toFixed(1)}<span class="unit">cm</span></div>
          <div class="zf-readout-size">
            <div class="lbl">Your ZipFit size</div>
            <div class="val" id="zfSizeReadout">US M ${range.mensUS}<span class="us">Women's ${range.womensUS}</span></div>
          </div>
        </div>

        <div class="zf-stepper">
          <button class="zf-step-btn" id="zfMinus" aria-label="Decrease length">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
          </button>
          <div class="zf-slider-wrap">
            <div class="zf-slider-track"><div class="zf-slider-fill" id="zfFill" style="width:${pct}%"></div></div>
            <input type="range" class="zf-slider" id="zfSlider"
              min="${CM_MIN}" max="${CM_MAX}" step="${CM_STEP}" value="${cm}"
              aria-label="Insole length in centimeters">
          </div>
          <button class="zf-step-btn" id="zfPlus" aria-label="Increase length">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
        <div class="zf-slider-ticks">
          <span>21cm</span><span>24</span><span>26</span><span>28</span><span>30</span><span>33cm</span>
        </div>

        <p class="zf-size-help">
          <b>Why measure?</b> ZipFit insoles come in size ranges and trim to fit. Measuring your existing insole is the most accurate way to match.
        </p>
      </div>

      <div class="zf-actions">
        <button class="zf-btn zf-btn--secondary" id="zfBack" aria-label="Back">${svgUse('i-arrow-left')}</button>
        <button class="zf-btn" id="zfNext">
          See my insole
          ${svgUse('i-arrow-right')}
        </button>
      </div>
    </div>`;

  const slider = document.getElementById('zfSlider');
  const fill = document.getElementById('zfFill');
  const cmOut = document.getElementById('zfCmReadout');
  const sizeOut = document.getElementById('zfSizeReadout');

  const updateUI = (v) => {
    answers.insoleCm = v;
    const r = sizeForCm(v);
    const p = ((v - CM_MIN) / (CM_MAX - CM_MIN)) * 100;
    fill.style.width = p + '%';
    cmOut.innerHTML = `${v.toFixed(1)}<span class="unit">cm</span>`;
    sizeOut.innerHTML = `US M ${r.mensUS}<span class="us">Women's ${r.womensUS}</span>`;
  };

  slider.addEventListener('input', (e) => {
    updateUI(parseFloat(e.target.value));
  });

  const bump = (delta) => {
    let v = Math.round((answers.insoleCm + delta) / CM_STEP) * CM_STEP;
    v = Math.max(CM_MIN, Math.min(CM_MAX, v));
    slider.value = v;
    updateUI(v);
  };
  document.getElementById('zfMinus').addEventListener('click', () => bump(-CM_STEP));
  document.getElementById('zfPlus').addEventListener('click', () => bump(+CM_STEP));

  document.getElementById('zfNext').addEventListener('click', () => {
    step++;
    renderResult();
  });
  document.getElementById('zfBack').addEventListener('click', () => { step--; renderQuestion(); });
}

function renderResult(){
  intro.hidden = true;
  setProgress();
  const { id, why } = recommend(answers);
  const p = PRODUCTS[id];
  const sizeRange = sizeForCm(answers.insoleCm);

  // Build the Shopify-ready product URL.
  // In a live storefront, /products/{handle} resolves to the product page.
  // Override SHOPIFY_BASE_URL to point at a specific shop while testing.
  const baseUrl = window.SHOPIFY_BASE_URL || 'https://zipfit.com';
  const productUrl = `${baseUrl}/products/${p.handle}`;

  stage.innerHTML = `
    <div class="zf-result">
      <div class="zf-result-eyebrow"><span class="dot"></span> Your best match</div>
      <div class="zf-card">
        <div class="zf-card-hero">
          <div class="zf-card-photo">
            <img src="${p.image}" alt="${p.name} insole" loading="eager">
          </div>
          <div class="zf-card-meta">
            <div class="zf-card-hero-text">
              <div class="zf-card-tag">ZipFit Insoles · Made in Italy</div>
              <h2 class="zf-card-name">${p.name}</h2>
            </div>
            <div class="zf-card-pricepill">${p.price}<small>USD</small></div>
          </div>
          <div style="height:20px;background:var(--zf-bg)"></div>
        </div>

        <div class="zf-size-line">
          <span class="zf-size-pill">US M ${sizeRange.mensUS}<small>${answers.insoleCm.toFixed(1)} cm insole</small></span>
          <span class="your-size">Women's US ${sizeRange.womensUS}</span>
        </div>

        <p class="zf-card-tagline">${p.tagline}</p>

        <ul class="zf-spec-list">
          <li class="zf-spec"><span class="zf-spec-key">Material</span><span class="zf-spec-val">${p.material}</span></li>
          <li class="zf-spec"><span class="zf-spec-key">Best for</span><span class="zf-spec-val">${p.bestFor}</span></li>
          <li class="zf-spec"><span class="zf-spec-key">Profile</span><span class="zf-spec-val">${p.profile}</span></li>
        </ul>

        <div class="zf-badges">${p.badges.map(b => `<span class="zf-badge">${b}</span>`).join('')}</div>

        <div class="zf-why">
          <div class="zf-why-label">Why the ${p.name}</div>
          ${why}
        </div>

        <div class="zf-result-actions">
          <a class="zf-shop" href="${productUrl}" id="zfShopBtn" target="_top">
            Shop the ${p.name}
            ${svgUse('i-arrow-right')}
          </a>
          <div class="zf-result-nav">
            <button class="zf-restart" id="zfBackResult" type="button">
              <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 5-7 7 7 7"/></svg>
              Edit my answers
            </button>
            <button class="zf-restart" id="zfRestart" type="button">Start over</button>
          </div>
        </div>
      </div>

      <div class="zf-trust">
        <div class="zf-trust-item">${svgUse('i-italy')}<span>Made in Italy</span></div>
        <div class="zf-trust-item">${svgUse('i-clock')}<span>Since 1989</span></div>
        <div class="zf-trust-item">${svgUse('i-leaf')}<span>OMFit Cork</span></div>
      </div>
    </div>`;

  document.getElementById('zfRestart').addEventListener('click', () => {
    answers = {}; step = 0; progressWrap.hidden = false; renderQuestion();
  });
  document.getElementById('zfBackResult').addEventListener('click', () => {
    step = TOTAL_STEPS - 1;
    renderQuestion();
  });

  // Emit a CustomEvent so the storefront can hook analytics
  document.dispatchEvent(new CustomEvent('zf:recommend', {
    detail: { product: p.handle, answers: { ...answers } }
  }));
}

// Boot
renderQuestion();
</script>
</body>
</html>
