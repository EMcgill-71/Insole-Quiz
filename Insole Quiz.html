<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Your Perfect ZipFit Insole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
  ============================================================
  ZipFit Insole Finder — Shopify-embeddable quiz
  ============================================================
  Integration: paste <style>, <body>, and <script> into a
  Shopify section (sections/insole-quiz.liquid). All selectors
  are scoped to .zfq-* so there are no collisions.

  Replace product handles and SHOPIFY_BASE_URL before going live.
  The quiz emits CustomEvent('zf:recommend', { detail: {...} })
  on document for analytics wiring (Klaviyo, GA4, etc.).
  ============================================================
-->

<style>
/* ── reset ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
button{font-family:inherit;cursor:pointer}

/* ── page ───────────────────────────────────────────────── */
body{
  background:#F1EDE7;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:24px 16px 48px;
}

/* ── card shell ─────────────────────────────────────────── */
.zfq-card{
  background:#fff;
  border-radius:20px;
  width:100%;
  max-width:540px;
  box-shadow:0 8px 48px rgba(0,0,0,0.10);
  overflow:hidden;
  position:relative;
}
.zfq-card::before{
  content:"";
  display:block;
  height:4px;
  background:linear-gradient(90deg,#EF4623 0%,#FBCF21 20%,#68BD46 40%,#5DC7D1 60%,#2F438F 80%,#952A7D 100%);
}

/* ── top bar ────────────────────────────────────────────── */
.zfq-topbar{
  display:flex;
  align-items:center;
  padding:16px 20px;
  border-bottom:1px solid #f0f0f0;
}
.zfq-logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:18px;
  letter-spacing:-0.3px;
  color:#1a1a1a;
  text-decoration:none;
}
.zfq-logo sup{font-size:10px;vertical-align:super}
.zfq-close{
  margin-left:auto;
  background:none;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  transition:background .15s,color .15s;
}
.zfq-close:hover{background:#f5f5f5;color:#1a1a1a}
.zfq-close svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}

/* ── progress area ──────────────────────────────────────── */
.zfq-progress-area{
  padding:14px 20px 12px;
  background:#fafafa;
  border-bottom:1px solid #f0f0f0;
}

/* walking foot */
.zfq-foot-track{
  position:relative;
  height:30px;
  margin-bottom:8px;
}
.zfq-foot-track-bg{
  position:absolute;
  top:50%;left:4px;right:4px;height:3px;
  transform:translateY(-50%);
  background:#e8e8e8;
  border-radius:999px;
}
.zfq-foot-trail{
  position:absolute;
  top:50%;left:4px;height:3px;
  transform:translateY(-50%);
  background:linear-gradient(90deg,#EF4623 0%,#FBCF21 20%,#68BD46 40%,#5DC7D1 60%,#2F438F 80%,#952A7D 100%);
  border-radius:999px;
  width:0%;
  transition:width .55s cubic-bezier(.4,0,.2,1);
}
.zfq-foot-walker{
  position:absolute;
  top:50%;
  left:0%;
  transform:translate(-50%,-50%);
  transition:left .55s cubic-bezier(.4,0,.2,1);
  animation:zfqBounce .7s ease-in-out infinite alternate;
  color:#EF4623;
}
@keyframes zfqBounce{
  from{transform:translate(-50%,-50%) rotate(-10deg)}
  to{transform:translate(-50%,-56%) rotate(10deg)}
}
.zfq-foot-walker svg{
  width:22px;height:22px;
  stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;fill:none;
  display:block;
}

.zfq-progress-label{
  font-size:12px;
  color:#888;
  text-align:center;
  font-weight:500;
}

/* ── body ───────────────────────────────────────────────── */
.zfq-body{
  padding:24px 20px 28px;
}

/* ── step transition ─────────────────────────────────────── */
.zfq-step-wrap{
  animation:zfqStepIn .3s cubic-bezier(.4,0,.2,1);
}
@keyframes zfqStepIn{
  from{opacity:0;transform:translateX(14px)}
  to{opacity:1;transform:translateX(0)}
}

/* ── question header ─────────────────────────────────────── */
.zfq-qlabel{
  font-size:11px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#EF4623;
  margin-bottom:10px;
}
.zfq-qtitle{
  font-size:22px;
  font-weight:700;
  color:#1a1a1a;
  line-height:1.22;
  margin:0 0 6px;
}
.zfq-qsub{
  font-size:13px;
  color:#888;
  margin:0 0 18px;
}

/* ── option grid layouts ─────────────────────────────────── */
.zfq-opts{
  display:grid;
  gap:10px;
}
.zfq-opts.g2{grid-template-columns:1fr 1fr}
.zfq-opts.g1{grid-template-columns:1fr}
.zfq-opts.g3{grid-template-columns:1fr 1fr 1fr}

/* ── option card ─────────────────────────────────────────── */
.zfq-opt{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:8px;
  padding:14px 10px 13px;
  background:#fff;
  border:1.5px solid #e8e8e8;
  border-radius:12px;
  transition:border-color .15s,box-shadow .15s,transform .1s;
  -webkit-tap-highlight-color:transparent;
  min-height:76px;
}
.zfq-opt:hover{border-color:#bbb}
.zfq-opt.sel{
  border-color:#EF4623;
  box-shadow:0 0 0 1px #EF4623;
  background:#fff9f8;
}
.zfq-opt:active{transform:scale(.97)}

/* list-style variant */
.zfq-opt.row{
  flex-direction:row;
  text-align:left;
  gap:12px;
  padding:12px 14px;
  min-height:52px;
}

/* pain-grid small cards */
.zfq-opts.g3 .zfq-opt{
  padding:10px 6px 9px;
  min-height:62px;
  gap:6px;
}

/* icon container */
.zfq-opt-icon{
  flex-shrink:0;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  color:#1a1a1a;
}
.zfq-opt-icon svg{
  width:22px;height:22px;
  stroke:currentColor;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;fill:none;
  display:block;
}
.zfq-opts.g3 .zfq-opt-icon{width:26px;height:26px}
.zfq-opts.g3 .zfq-opt-icon svg{width:18px;height:18px}

/* row variant: icon has a pill bg */
.zfq-opt.row .zfq-opt-icon{
  background:#f4f4f4;
  border-radius:8px;
  transition:background .15s,color .15s;
}
.zfq-opt.row.sel .zfq-opt-icon{background:#EF4623;color:#fff}

/* text */
.zfq-opt-body{display:flex;flex-direction:column;flex:1;min-width:0}
.zfq-opt-label{
  font-size:13px;
  font-weight:600;
  color:#1a1a1a;
  line-height:1.25;
}
.zfq-opts.g3 .zfq-opt-label{font-size:11px}
.zfq-opt.row .zfq-opt-label{font-size:14px}
.zfq-opt-desc{
  font-size:11.5px;
  color:#888;
  margin-top:3px;
  line-height:1.3;
}

/* ── actions ─────────────────────────────────────────────── */
.zfq-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.zfq-btn-next{
  flex:1;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;
  background:#EF4623;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
  transition:opacity .15s,transform .1s;
}
.zfq-btn-next:disabled{opacity:.35;cursor:not-allowed}
.zfq-btn-next:not(:disabled):hover{opacity:.88}
.zfq-btn-next:not(:disabled):active{transform:scale(.98)}
.zfq-btn-next svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}

.zfq-btn-back{
  display:inline-flex;align-items:center;gap:6px;
  padding:13px 16px;
  background:none;
  border:1.5px solid #ddd;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  color:#666;
  transition:border-color .15s,color .15s,background .15s;
}
.zfq-btn-back:hover{border-color:#999;color:#1a1a1a;background:#f9f9f9}
.zfq-btn-back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}


/* ── result page ─────────────────────────────────────────── */
.zfq-result-eyebrow{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:#EF4623;
  margin-bottom:12px;
}
.zfq-result-eyebrow .dot{
  width:7px;height:7px;border-radius:50%;
  background:#EF4623;
  box-shadow:0 0 0 4px rgba(239,70,35,.18);
}
.zfq-result-title{
  font-size:26px;font-weight:700;color:#1a1a1a;
  line-height:1.18;margin:0 0 16px;
}

.zfq-prod-card{
  background:#fafafa;
  border:1.5px solid #e8e8e8;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:16px;
}
.zfq-prod-img{
  background:#F1EDE7;
  padding:28px 24px;
  display:flex;align-items:center;justify-content:center;
  min-height:180px;
}
.zfq-prod-img img{
  max-width:260px;max-height:150px;
  object-fit:contain;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.13));
  animation:zfqImgIn .5s cubic-bezier(.4,0,.2,1);
}
@keyframes zfqImgIn{
  from{opacity:0;transform:translateY(8px) scale(.96)}
  to{opacity:1;transform:none}
}
.zfq-prod-body{padding:18px 20px 20px}
.zfq-prod-tag{
  font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:#888;margin-bottom:5px;
}
.zfq-prod-name{
  font-size:26px;font-weight:700;color:#1a1a1a;
  margin:0 0 6px;line-height:1.1;
}
.zfq-prod-desc{
  font-size:14px;color:#555;
  line-height:1.55;margin:0 0 14px;
}
.zfq-prod-why{
  background:#1a1a1a;color:#fff;
  border-radius:10px;
  padding:13px 16px;
  font-size:13px;line-height:1.6;
  margin-bottom:16px;
}
.zfq-prod-why-lbl{
  font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  color:#f5c842;margin-bottom:6px;
  display:flex;align-items:center;gap:8px;
}
.zfq-prod-why-lbl::before{
  content:"";display:inline-block;
  width:14px;height:1.5px;background:#f5c842;
}
.zfq-prod-price{
  font-size:19px;font-weight:700;color:#1a1a1a;
  margin-bottom:14px;
}
.zfq-btn-shop{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;
  background:#EF4623;color:#fff;
  border:none;border-radius:10px;
  font-size:14px;font-weight:700;
  text-decoration:none;
  width:100%;
  transition:opacity .15s;
}
.zfq-btn-shop:hover{opacity:.88}
.zfq-btn-shop svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}

.zfq-result-nav{
  display:flex;
  border-top:1px solid #f0f0f0;
}
.zfq-nav-btn{
  flex:1;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:14px;
  background:none;border:none;
  font-size:13px;font-weight:500;
  color:#666;
  transition:color .15s,background .15s;
}
.zfq-nav-btn:hover{color:#1a1a1a;background:#f9f9f9}
.zfq-nav-btn+.zfq-nav-btn{border-left:1px solid #f0f0f0}
.zfq-nav-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}

/* key features strip */
.zfq-features{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:16px;
}
.zfq-feat{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:5px;padding:10px 6px 11px;
  background:#fafafa;border:1.5px solid #f0f0f0;border-radius:10px;
}
.zfq-feat-icon{
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  color:#EF4623;
}
.zfq-feat-icon svg{
  width:22px;height:22px;
  stroke:currentColor;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;fill:none;
}
.zfq-feat-label{
  font-size:11px;font-weight:700;color:#1a1a1a;line-height:1.2;
}
.zfq-feat-sub{
  font-size:10px;color:#888;line-height:1.3;
}

/* trust strip */
.zfq-trust{
  display:flex;justify-content:space-around;
  padding:13px 14px;
  background:#fff;
  border:1.5px solid #e8e8e8;
  border-radius:12px;
  margin-top:14px;
}
.zfq-trust-item{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:10px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;
  color:#666;text-align:center;
}
.zfq-trust-item svg{
  width:18px;height:18px;
  stroke:#1a1a1a;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;fill:none;
}

/* ── responsive ──────────────────────────────────────────── */
@media (max-width:500px){
  body{padding:0;align-items:stretch}
  .zfq-card{border-radius:0;min-height:100vh;box-shadow:none}
}
@media (max-width:380px){
  .zfq-opts.g2{grid-template-columns:1fr}
  .zfq-opts.g3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="zfq-card" id="zfqCard">

  <!-- Top bar -->
  <header class="zfq-topbar">
    <a class="zfq-logo" href="/" aria-label="ZipFit home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">

              stroke-linecap="round" stroke-linejoin="round"/>

      <div class="zfq-foot-track-bg"></div>
      <div class="zfq-foot-trail" id="zfqTrail"></div>
      <div class="zfq-foot-walker" id="zfqWalker">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 17c0-2 2-3 4-3l4-3h3l3 2 4 1c1 0 2 1 2 2v3H3z"/>

    <p class="zfq-progress-label" id="zfqProgressLabel">Takes about a minute. Built on 30+ years of ZipFit expertise.</p>

  <!-- Dynamic quiz body -->
  <div class="zfq-body" id="zfqBody"></div>

</div>

// Result immediately follows the last question step
const RESULT_STEP = STEPS.length;
const TOTAL = RESULT_STEP; // used for progress pct

// ── State ────────────────────────────────────────────────────
let step = 0;
let answers = {};

// ── Recommendation logic ─────────────────────────────────────
function recommend() {
  const shoe = answers.shoeType;
  const arch = answers.archType;

  // Hiking / work → Wander (most structured)
  if (shoe === 'work-boots') return { id:'wander',    why: WHY['wander-work'] };
  if (shoe === 'hike-boots') return { id:'wander',    why: WHY['wander-hike'] };

  // Alpine ski / multi-sport → Crossover
  if (shoe === 'ski-boots')  return { id:'crossover', why: WHY['crossover-ski'] };

  // Running → Zippy
  if (shoe === 'running')    return { id:'zippy',     why: WHY['zippy-running'] };

  // High arch + active → Crossover
  if (arch === 'high' && (shoe === 'sneakers' || !shoe))
                             return { id:'crossover', why: WHY['crossover-high-arch'] };

  // Dress / everyday / default → Legacy
  if (shoe === 'dress')      return { id:'legacy',    why: WHY['legacy-dress'] };
  if (shoe === 'sneakers')   return { id:'legacy',    why: WHY['legacy-sneakers'] };

  return { id:'legacy', why: WHY['legacy-default'] };
}

// ── Progress ──────────────────────────────────────────────────
function updateProgress() {
  const pct = step >= TOTAL ? 100 : Math.round((step / TOTAL) * 100);
  const trail  = document.getElementById('zfqTrail');
  const walker = document.getElementById('zfqWalker');
  const label  = document.getElementById('zfqProgressLabel');
  if (trail)  trail.style.width = pct + '%';
  if (walker) walker.style.left = Math.min(pct, 96) + '%';
  if (label) {
    if (step === 0)           label.textContent = "Takes about a minute. Built on 30+ years of ZipFit expertise.";
    else if (step >= TOTAL)   label.textContent = 'Your recommendation is ready!';
    else                      label.textContent = pct + '% complete';
  }
}

// ── Render dispatcher ────────────────────────────────────────
function render() {
  updateProgress();
  const body = document.getElementById('zfqBody');
  if (step >= RESULT_STEP)  { renderResult(body); return; }
  renderQuestion(body, STEPS[step]);
}

// ── Question step ────────────────────────────────────────────
function renderQuestion(body, s) {
  const isMulti = s.type === 'multi';
  const isList  = s.layout.includes('list');
  const sel     = answers[s.key] || (isMulti ? [] : null);

  const optsHtml = s.opts.map(o => {
    const isSel = isMulti ? sel.includes(o.val) : sel === o.val;
    return `
      <button class="zfq-opt ${isList ? 'row' : ''} ${isSel ? 'sel' : ''}" data-val="${o.val}">
        <span class="zfq-opt-icon">${USE(o.icon)}</span>
        <span class="zfq-opt-body">
          <span class="zfq-opt-label">${o.label}</span>
          ${o.desc ? `<span class="zfq-opt-desc">${o.desc}</span>` : ''}
        </span>
      </button>`;
  }).join('');

  const hasNext  = isMulti;
  const nextDis  = isMulti && sel.length === 0 ? 'disabled' : '';

  body.innerHTML = `
    <div class="zfq-step-wrap">
      <p class="zfq-qlabel">${s.label}</p>
      <h2 class="zfq-qtitle">${s.q}</h2>
      ${s.sub ? `<p class="zfq-qsub">${s.sub}</p>` : ''}
      <div class="zfq-opts ${s.layout}">${optsHtml}</div>
      <div class="zfq-actions">
        ${step > 0 ? `<button class="zfq-btn-back" id="zfqBack">${USE('zi-arrow-l')} Back</button>` : ''}
        ${hasNext ? `<button class="zfq-btn-next" id="zfqNext" ${nextDis}>Next ${USE('zi-arrow-r')}</button>` : ''}
      </div>
    </div>`;

  body.querySelectorAll('.zfq-opt').forEach(card => {
    card.addEventListener('click', () => onOption(card, s));
  });
  document.getElementById('zfqNext')?.addEventListener('click', () => { step++; render(); });
  document.getElementById('zfqBack')?.addEventListener('click', () => { step--; render(); });
}

function onOption(card, s) {
  const val     = card.dataset.val;
  const isMulti = s.type === 'multi';

  if (isMulti) {
    if (!answers[s.key]) answers[s.key] = [];
    const arr = answers[s.key];
    const idx = arr.indexOf(val);
    if (idx > -1) { arr.splice(idx, 1); card.classList.remove('sel'); }
    else           { arr.push(val);      card.classList.add('sel'); }
    const btn = document.getElementById('zfqNext');
    if (btn) btn.disabled = arr.length === 0;
  } else {
    answers[s.key] = val;
    document.querySelectorAll('.zfq-opt').forEach(c => c.classList.remove('sel'));
    card.classList.add('sel');
    setTimeout(() => { step++; render(); }, 220);
  }
}

  const pains = (answers.painConditions || []).filter(v => v !== 'none');
  const painHtml = pains.length > 0 ? `
    <div style="margin-bottom:16px;border:1.5px solid #f0e8e4;border-radius:10px;overflow:hidden">
      <div style="background:#EF4623;color:#fff;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px">
        How ZipFit addresses your concerns
      </div>
      <ul style="margin:0;padding:10px 14px 12px;list-style:none;display:flex;flex-direction:column;gap:8px">
        ${pains.map(v => PAIN_COPY[v] ? `<li style="font-size:13px;color:#444;line-height:1.5;padding-left:16px;position:relative"><span style="position:absolute;left:0;color:#EF4623;font-weight:700">·</span>${PAIN_COPY[v]}</li>` : '').join('')}
      </ul>
    </div>` : '';

  body.innerHTML = `
    <div class="zfq-step-wrap">
      <div class="zfq-result-eyebrow"><span class="dot"></span> Your best match</div>
      <h2 class="zfq-result-title">We found your perfect ZipFit!</h2>
      <div class="zfq-prod-card">
        <div class="zfq-prod-img">
          <img src="${p.img}" alt="${p.name} insole">
        </div>
        <div class="zfq-prod-body">
          <p class="zfq-prod-tag">ZipFit Insoles · Made in Italy</p>
          <h3 class="zfq-prod-name">${p.name}</h3>
          <p style="font-size:15px;font-weight:600;color:#EF4623;margin:0 0 8px;line-height:1.3">${p.tagline}</p>
          <p class="zfq-prod-desc">${p.desc}</p>
          <ul style="margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px">
            ${p.features.map(f => `<li style="font-size:13px;color:#444;line-height:1.45;padding-left:18px;position:relative"><span style="position:absolute;left:0;color:#EF4623;font-weight:700">✓</span>${f}</li>`).join('')}
          </ul>
          <p style="font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0 0 14px;color:#888"><span style="color:#1a1a1a">Best for:</span> ${p.bestFor}</p>
          ${painHtml}
          <div class="zfq-prod-why">
            <p class="zfq-prod-why-lbl">Why the ${p.name.replace('ZipFit ','')}</p>
            ${why}
          </div>
          <p class="zfq-prod-price">${p.price} <small style="font-size:12px;font-weight:500;color:#888">USD</small></p>
          <a class="zfq-btn-shop" href="${url}" id="zfqShopBtn" target="_top">
            Shop the ${p.name} ${USE('zi-arrow-r')}
          </a>
        </div>
        <div class="zfq-result-nav">
          <button class="zfq-nav-btn" id="zfqEditAnswers">
            ${USE('zi-edit')} Edit answers
          </button>
          <button class="zfq-nav-btn" id="zfqRestart">
            ${USE('zi-reload')} Start over
          </button>
        </div>
      </div>
      <div class="zfq-trust">
        <div class="zfq-trust-item">${USE('zi-italy')}<span>Made in Italy</span></div>
        <div class="zfq-trust-item">${USE('zi-clock')}<span>30+ Years Expertise</span></div>
        <div class="zfq-trust-item">${USE('zi-leaf')}<span>Drop-In Replaceable</span></div>
      </div>
    </div>`;

  document.getElementById('zfqRestart').addEventListener('click', () => {
    answers = {}; step = 0; render();
  });
  document.getElementById('zfqEditAnswers').addEventListener('click', () => {
    step = RESULT_STEP - 1; render();
  });

  // Analytics hook
  document.dispatchEvent(new CustomEvent('zf:recommend', {
    detail: { product: p.handle, answers: { ...answers } }
  }));
}

// ── Boot ─────────────────────────────────────────────────────
document.getElementById('zfqClose').addEventListener('click', () => {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'zf:quiz:close' }, '*');
  }
  // Fallback: reset quiz to start
  answers = {}; step = 0; render();
});

render();
</script>

</body>
</html>
